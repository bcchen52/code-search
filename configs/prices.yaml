# Dated price table for cost accounting, in US dollars per million tokens.
# Fill in from each provider's pricing page, and update as_of with every change;
# every reported cost depends on it. A price left null is an error when a call
# needs it, never a free call.
#
# cached_input is a prompt-cache read; cache_write is a 5-minute prompt-cache
# write (1.25x input).
as_of: "2026-10-06"
usd_per_million_tokens:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cached_input: 0.20, cache_write: 2.50}
  claude-sonnet-5: {input: 2.00, output: 10.00, cached_input: 0.20, cache_write: 2.50}  # server-side fallback
  voyage-4: {input: null}
